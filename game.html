<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>HTM Game Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      user-select: none;
      cursor: default;
    }

    #app {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #000;
    }

    /* ── Splash screen ── */
    #splash {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s;
    }

    #splash.hidden { opacity: 0; pointer-events: none; }

    #splash-text {
      color: #fff;
      font-size: 80px;
      font-weight: bold;
      text-align: center;
      max-width: 1700px;
      line-height: 1.2;
    }

    #splash-text.dim { opacity: 0.15; font-size: 60px; }

    /* ── Logo ── */
    #logo {
      position: absolute;
      top: 15px;
      left: 46px;
      max-width: 1000px;
      max-height: 260px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 5;
    }

    #logo.visible { opacity: 1; }

    /* ── Timer ── */
    #timer-area {
      position: absolute;
      top: 280px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    #negative-symbol {
      color: #fff;
      font-size: 220px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      opacity: 0;
      line-height: 1;
      margin-right: 10px;
    }

    #timer-display {
      color: #fff;
      font-size: 300px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      line-height: 1;
      letter-spacing: -10px;
    }

    /* ── Clue counter badge ── */
    #clue-counter {
      position: absolute;
      top: 20px;
      right: 40px;
      color: #888;
      font-size: 36px;
      z-index: 5;
    }

    /* ── Clue text box ── */
    #clue-box {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 52px;
      font-weight: bold;
      padding: 0 80px;
      line-height: 1.3;
    }

    /* ── Volume indicator ── */
    #volume-bar {
      position: absolute;
      bottom: 20px;
      right: 40px;
      color: #666;
      font-size: 28px;
    }

    /* ── Status strip (paused / running) ── */
    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #444;
      font-size: 28px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Splash -->
  <div id="splash">
    <p id="splash-text" class="dim">Please wait until you are instructed to begin.</p>
  </div>

  <!-- Logo -->
  <img id="logo" src="" alt="Logo" />

  <!-- Timer -->
  <div id="timer-area">
    <span id="negative-symbol">-</span>
    <span id="timer-display">60:00</span>
  </div>

  <!-- Status -->
  <div id="status">PAUSED</div>

  <!-- Clue counter -->
  <div id="clue-counter">Clues: 0</div>

  <!-- Clue text -->
  <div id="clue-box">...</div>

  <!-- Volume -->
  <div id="volume-bar">Vol: 40%</div>
</div>

<script src="game.js"></script>
</body>
</html>
