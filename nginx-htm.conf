server {
    listen 80;
    listen [::]:80;
    server_name hourtomidnight hourtomidnight.local _;

    # ── Landing page ──────────────────────────────────────────────────────────
    location = / {
        proxy_pass http://127.0.0.1:4000/index.html;
        proxy_set_header Host $host;
    }

    # ── SSE — must disable buffering or events stall ──────────────────────────
    location = /events {
        proxy_pass         http://127.0.0.1:4000/events;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── API endpoints ─────────────────────────────────────────────────────────
    location ~ ^/(cmd|config)$ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Everything else (static files: html, js, css, assets) ────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
